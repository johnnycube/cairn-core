# Copy to secrets.yaml (gitignored) and fill in real values. DO NOT commit
# secrets.yaml. These are plain `stringData` for readability — for real
# clusters prefer a SealedSecret / External Secrets / SOPS pipeline.
#
# Generate the two crypto secrets (32 random bytes, base64):
#   CAIRN_AUTH_SESSION_SECRET        : openssl rand -base64 32
#   CAIRN_AUTH_MASTER_ENCRYPTION_KEY : openssl rand -base64 32
# The master key encrypts ALL secrets-at-rest (OAuth tokens, webhook signing
# keys, NATS account key). Back it up SEPARATELY from the database — losing it
# means re-entering every stored credential.
#
# Keep the password inside CAIRN_DATABASE_URL identical to POSTGRES_PASSWORD,
# and the storage creds identical to the MinIO root user/password below.
apiVersion: v1
kind: Secret
metadata:
  name: cairn-secrets
  namespace: cairn
type: Opaque
stringData:
  # --- database (URL embeds the password; sslmode=disable is fine in-cluster) ---
  CAIRN_DATABASE_URL: "postgres://cairn:CHANGE_ME_DB_PASSWORD@postgres:5432/cairn?sslmode=disable"

  # --- blob store (must match the MinIO root creds) ---
  CAIRN_STORAGE_ACCESS_KEY_ID: "cairn"
  CAIRN_STORAGE_SECRET_ACCESS_KEY: "CHANGE_ME_MINIO_SECRET"

  # --- app crypto (openssl rand -base64 32) ---
  CAIRN_AUTH_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET"
  CAIRN_AUTH_MASTER_ENCRYPTION_KEY: "CHANGE_ME_MASTER_KEY"

  # --- first admin, created on first boot ---
  CAIRN_INSTANCE_BOOTSTRAP_ADMIN_EMAIL: "admin@cairn.example.com"
  CAIRN_INSTANCE_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
---
# Backing-service credentials. POSTGRES_PASSWORD must equal the password in
# CAIRN_DATABASE_URL above; MINIO_ROOT_* must equal the storage creds above.
apiVersion: v1
kind: Secret
metadata:
  name: cairn-infra-secrets
  namespace: cairn
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  MINIO_ROOT_USER: "cairn"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_MINIO_SECRET"
---
# Optional Strava webhook verify token, consumed by the Strava worker. Only
# needed if you register a Strava push subscription. (Strava OAuth client
# id/secret are per-user, entered in the Connections UI — not set here. Garmin
# credentials are per-user too: the worker fetches them from core over NATS, so
# nothing provider-credential-shaped belongs here for either worker.)
apiVersion: v1
kind: Secret
metadata:
  name: cairn-worker-secrets
  namespace: cairn
type: Opaque
stringData:
  CAIRN_STRAVA_WEBHOOK_VERIFY_TOKEN: ""
